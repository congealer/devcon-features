name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # The Feature list is read from the repository rather than written out here, so
  # that adding a Feature cannot leave it untested. Base images stay hardcoded:
  # nothing in the repository declares which ones are supported, and changing
  # that set is a deliberate decision.
  features:
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.list.outputs.all }}
      scenarios: ${{ steps.list.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v7

      - id: list
        name: "Collect the Features to test"
        run: |
          all=$(ls src | jq -R . | jq -sc .)
          scenarios=$(ls test/*/scenarios.json | cut -d/ -f2 | grep -v '^_global$' | jq -R . | jq -sc .)
          echo "all:       $all"
          echo "scenarios: $scenarios"
          echo "all=$all" >> "$GITHUB_OUTPUT"
          echo "scenarios=$scenarios" >> "$GITHUB_OUTPUT"

  test-autogenerated:
    needs: features
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ${{ fromJSON(needs.features.outputs.all) }}
        baseImage:
          - debian:latest
          - ubuntu:latest
          - mcr.microsoft.com/devcontainers/base:ubuntu
          - mcr.microsoft.com/devcontainers/base:debian
    steps:
      - uses: actions/checkout@v7

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        run: make unit-${{ matrix.features }} BASE_IMAGE=${{ matrix.baseImage }}

  # 'make scenario-*' skips the autogenerated test, which the job above already
  # covers against four base images. Scenarios bring their own image, so no
  # BASE_IMAGE here.
  test-scenarios:
    needs: features
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ${{ fromJSON(needs.features.outputs.scenarios) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing '${{ matrix.features }}' scenarios"
        run: make scenario-${{ matrix.features }}

  test-global:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing global scenarios"
        run: make test-global

  # One check with a name that does not change as the matrix grows, so that the
  # branch ruleset has a single thing to require.
  ci:
    if: always()
    needs: [test-autogenerated, test-scenarios, test-global]
    runs-on: ubuntu-latest
    steps:
      - name: "Fail if any test job did not succeed"
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "autogenerated: ${{ needs.test-autogenerated.result }}"
          echo "scenarios:     ${{ needs.test-scenarios.result }}"
          echo "global:        ${{ needs.test-global.result }}"
          exit 1
