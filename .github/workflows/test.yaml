name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      # Keep every other combination running when one of them fails.
      fail-fast: false
      matrix:
        features:
          - color
          - hello
          - prezto
          - arm-gnu-toolchain
        baseImage:
          - debian:latest
          - ubuntu:latest
          - mcr.microsoft.com/devcontainers/base:ubuntu
          - mcr.microsoft.com/devcontainers/base:debian
        exclude:
          # 'prezto' needs zsh (its install.sh has a zsh shebang), git and sudo;
          # 'arm-gnu-toolchain' needs curl and xz. The bare distro images ship
          # none of those, so both are limited to the devcontainers base images.
          - features: prezto
            baseImage: debian:latest
          - features: prezto
            baseImage: ubuntu:latest
          - features: arm-gnu-toolchain
            baseImage: debian:latest
          - features: arm-gnu-toolchain
            baseImage: ubuntu:latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-scenarios -f ${{ matrix.features }} -i ${{ matrix.baseImage }} .

  test-scenarios:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        features:
          - color
          - hello
          - arm-gnu-toolchain
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' scenarios"
        run: devcontainer features test -f ${{ matrix.features }} --skip-autogenerated --skip-duplicated .

  test-global:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing global scenarios"
        run: devcontainer features test --global-scenarios-only .
